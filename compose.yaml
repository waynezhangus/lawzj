services:
  next:
    image: ghcr.io/waynezhangus/lawzj-next:latest
    container_name: next
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - 3000
    networks:
      - internal

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: always
    env_file: .env
    shm_size: 128mb
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - 5432:5432
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - next
    networks:
      - internal

volumes:
  postgres:
  caddy_data:
  caddy_config:

networks:
  internal:
