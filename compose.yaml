services:
  next:
    build:
      context: ./next
      args:
        DATABASE_URL: ${DATABASE_URL}
    container_name: next
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - 3000
    networks:
      - internal

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: always
    env_file: .env
    shm_size: 128mb
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - 5432:5432
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - next
    ports:
      - "80:80"
    networks:
      - internal

volumes:
  postgres:

networks:
  internal:
